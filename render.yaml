# Spec 018: despliegue de la API en Render con la base de datos en Supabase.
# Los secretos llevan "sync: false": Render los pide en su panel al crear el
# Blueprint y nunca se escriben en este archivo.
services:
  - type: web
    name: manay-api
    runtime: docker
    plan: free
    # Render no tiene región en Sudamérica; la base de Supabase está en la
    # misma región (us-east-1) para que cada consulta tarde ~1 ms.
    region: virginia
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # El plan gratuito no tiene preDeployCommand: el arranque de la imagen
    # (backend/docker-entrypoint.sh) aplica las migraciones pendientes antes de
    # la API cuando RUN_MIGRATIONS_ON_START=true.
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - render.yaml
      ignoredPaths:
        - backend/test/**
        - backend/**/*.spec.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_START
        value: true
      - key: SESSION_TTL_MINUTES
        value: 480
      - key: TRUST_PROXY
        value: 1
      - key: OPENAPI_ENABLED
        value: false
      - key: CORS_ORIGINS
        value: http://localhost:8081
      - key: DATABASE_PORT
        value: 5432
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: true
      # El pooler de sesión de Supabase gratuito admite pocas conexiones.
      - key: DATABASE_POOL_SIZE
        value: 5
      - key: DATABASE_CONNECT_TIMEOUT_MS
        value: 10000
      # Host y usuario del pooler de sesión de Supabase (aws-1-us-east-1.pooler.supabase.com
      # y postgres.<referencia del proyecto>).
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # PEM del certificado «prod-ca-2021.crt» que se descarga en Supabase.
      - key: DATABASE_SSL_CA
        sync: false
