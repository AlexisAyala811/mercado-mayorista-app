<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1550" viewBox="0 0 1800 1550" role="img"><title>Estilo arquitectónico · Monolito modular en capas</title><desc>MERCADO · Operaciones comerciales y financieras · Sin módulos independientes de datos maestros</desc><rect width="1800" height="1550" fill="#f7f9fc"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#14283f" stroke="none" stroke-width="2"/><text x="64" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">Estilo arquitectónico · Monolito modular en capas</text><text x="64" y="114" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#c8d8e9">MERCADO · Operaciones comerciales y financieras · Sin módulos independientes de datos maestros</text><rect x="420" y="200" width="960" height="125" rx="16" fill="#e1effb" stroke="#2865b0" stroke-width="2"/><text x="438" y="243" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2865b0">Cliente Android</text><text x="438" y="285" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Captura táctil, sesión y órdenes locales pendientes.</text><rect x="150" y="395" width="1500" height="700" rx="0" fill="none" stroke="#53647c" stroke-width="2" stroke-dasharray="8 6"/><text x="185" y="442" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20344c">Una aplicación API NestJS · Un despliegue de todos los módulos</text><rect x="240" y="485" width="1320" height="155" rx="16" fill="#e1effb" stroke="#2865b0" stroke-width="2"/><text x="258" y="528" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2865b0">Presentación</text><text x="258" y="570" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Controladores, DTO y guardas por operación.</text><polyline points="900,640 900,685" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,685 893.0680722979873,669.4774880146907 906.9319277020127,669.4774880146907" fill="#6b7d93"/><rect x="240" y="685" width="1320" height="155" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="258" y="728" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Aplicación y reglas</text><text x="258" y="770" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Pesaje, compra, venta, cuentas, costos, historial y auditoría.</text><polyline points="900,840 900,885" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,885 893.0680722979873,869.4774880146907 906.9319277020127,869.4774880146907" fill="#6b7d93"/><rect x="240" y="885" width="1320" height="155" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="258" y="928" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">Acceso a datos</text><text x="258" y="970" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Repositorios y transacciones TypeORM con entidades compartidas.</text><polyline points="900,325 900,395" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,395 893.0680722979873,379.4774880146908 906.9319277020127,379.4774880146908" fill="#6b7d93"/><polyline points="900,1095 900,1170" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,1170 893.0680722979873,1154.4774880146908 906.9319277020127,1154.4774880146908" fill="#6b7d93"/><rect x="420" y="1170" width="960" height="125" rx="16" fill="#efe7f8" stroke="#7950a8" stroke-width="2"/><text x="438" y="1213" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7950a8">PostgreSQL</text><text x="438" y="1255" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Historial por operación, saldos financieros y PDF.</text><rect x="54" y="1396" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="1434" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Proveedores, variedades y transporte pertenecen a cada operación. Se conservan los requisitos y saldos financieros. No hay módulos independientes de datos</text><text x="76" y="1462" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">comerciales ni control de existencias. Todos los módulos backend se despliegan juntos.</text><text x="62" y="1526" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  14 historias  ·  Sin saldo de mercadería</text></svg>