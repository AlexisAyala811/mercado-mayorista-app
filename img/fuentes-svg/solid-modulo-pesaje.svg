<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1940" viewBox="0 0 1800 1940" role="img"><title>Principios SOLID · Ingreso de pesos de papa</title><desc>Referencia: recepción y pesaje saco por saco · HU01 / HU05 · Diseño objetivo con evidencia del código</desc><rect width="1800" height="1940" fill="#f7f9fc"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#14283f" stroke="none" stroke-width="2"/><text x="64" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">Principios SOLID · Ingreso de pesos de papa</text><text x="64" y="114" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#c8d8e9">Referencia: recepción y pesaje saco por saco · HU01 / HU05 · Diseño objetivo con evidencia del código</text><rect x="55" y="230" width="325" height="1290" rx="0" fill="#eaf2fc" stroke="#a8c1e2" stroke-width="2" stroke-dasharray="8 6"/><text x="134.5078125" y="276" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">PRESENTACIÓN</text><rect x="430" y="230" width="370" height="1290" rx="0" fill="#eaf6ec" stroke="#abd0b0" stroke-width="2" stroke-dasharray="8 6"/><text x="550.0" y="276" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">APLICACIÓN</text><rect x="850" y="230" width="390" height="1290" rx="0" fill="#fff5e2" stroke="#ddc6a0" stroke-width="2" stroke-dasharray="8 6"/><text x="999.0" y="276" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">DOMINIO</text><rect x="1290" y="230" width="450" height="1290" rx="0" fill="#f2edfa" stroke="#cab9e2" stroke-width="2" stroke-dasharray="8 6"/><text x="1411.0" y="276" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">INFRAESTRUCTURA</text><rect x="72" y="365" width="292" height="190" rx="0" fill="white" stroke="#718195" stroke-width="2"/><text x="154.0" y="389" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#65768c">[Código existente]</text><text x="114.0" y="420" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">ReceptionController</text><polyline points="72,435 364,435" fill="none" stroke="#6b7d93" stroke-width="3"/><text x="84" y="470" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">+ addSack(identity,</text><text x="84" y="494" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">receptionId, input)</text><text x="84" y="518" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Traduce HTTP y delega</text><circle cx="340" cy="346" r="15" fill="#2d64aa"/><text x="334.0" y="352" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">S</text><rect x="450" y="365" width="330" height="315" rx="0" fill="white" stroke="#718195" stroke-width="2"/><text x="536.0" y="389" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#65768c">[Extracción propuesta]</text><text x="494.0" y="420" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">RegistrarPesoCasoUso</text><polyline points="450,435 780,435" fill="none" stroke="#6b7d93" stroke-width="3"/><text x="462" y="470" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">- pesajes: RepositorioPesajes</text><text x="462" y="494" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">- trabajo: UnidadTrabajoPesaje</text><text x="462" y="518" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">- auditoria: AuditoriaPesaje</text><text x="462" y="542" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">+ ejecutar(orden)</text><text x="462" y="566" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Coordina validación y confirmación</text><circle cx="756" cy="346" r="15" fill="#2d64aa"/><text x="750.0" y="352" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">S</text><circle cx="718" cy="346" r="15" fill="#b34a40"/><text x="711.5" y="352" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">D</text><rect x="868" y="365" width="354" height="205" rx="0" fill="white" stroke="#718195" stroke-width="2"/><text x="937.0" y="389" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#65768c">[Modelo / extracción de reglas]</text><text x="914.0" y="420" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">PesoSaco / ReglasPesaje</text><polyline points="868,435 1222,435" fill="none" stroke="#6b7d93" stroke-width="3"/><text x="880" y="470" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">+ calcularNeto(bruto, tara)</text><text x="880" y="494" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">+ validarPeso()</text><text x="880" y="518" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Bruto &gt; 0; 0 ≤ tara &lt; bruto</text><text x="880" y="542" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Precisión: 3 decimales</text><circle cx="1198" cy="346" r="15" fill="#2d64aa"/><text x="1192.0" y="352" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">S</text><rect x="868" y="650" width="354" height="150" rx="0" fill="white" stroke="#718195" stroke-width="2"/><text x="977.5" y="674" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#65768c">[Interfaz propuesta]</text><text x="944.5" y="705" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">RepositorioPesajes</text><polyline points="868,720 1222,720" fill="none" stroke="#6b7d93" stroke-width="3"/><text x="880" y="755" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">+ guardar(saco)</text><text x="880" y="779" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">+ buscarPorUUID(negocio, uuid)</text><circle cx="1198" cy="631" r="15" fill="#8052ac"/><text x="1195.5" y="637" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">I</text><rect x="868" y="945" width="354" height="165" rx="0" fill="white" stroke="#718195" stroke-width="2"/><text x="977.5" y="969" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#65768c">[Interfaz propuesta]</text><text x="935.0078125" y="1000" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">UnidadTrabajoPesaje</text><polyline points="868,1015 1222,1015" fill="none" stroke="#6b7d93" stroke-width="3"/><text x="880" y="1050" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">+ ejecutarAtomicamente(accion)</text><text x="880" y="1074" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Bloqueo, versión e idempotencia</text><text x="880" y="1098" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Sin exponer EntityManager al dominio</text><circle cx="1198" cy="926" r="15" fill="#8052ac"/><text x="1195.5" y="932" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">I</text><rect x="868" y="1225" width="354" height="150" rx="0" fill="white" stroke="#718195" stroke-width="2"/><text x="977.5" y="1249" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#65768c">[Interfaz propuesta]</text><text x="963.0" y="1280" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">AuditoriaPesaje</text><polyline points="868,1295 1222,1295" fill="none" stroke="#6b7d93" stroke-width="3"/><text x="880" y="1330" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">+ registrar(evento)</text><text x="880" y="1354" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Usuario, fecha, acción y origen</text><circle cx="1198" cy="1206" r="15" fill="#8052ac"/><text x="1195.5" y="1212" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">I</text><rect x="1308" y="650" width="414" height="150" rx="0" fill="white" stroke="#718195" stroke-width="2"/><text x="1436.5" y="674" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#65768c">[Adaptador propuesto]</text><text x="1370.5" y="705" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">PesajesPostgreSQLAdapter</text><polyline points="1308,720 1722,720" fill="none" stroke="#6b7d93" stroke-width="3"/><text x="1320" y="755" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">+ guardar(saco)</text><text x="1320" y="779" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">+ buscarPorUUID(negocio, uuid)</text><circle cx="1698" cy="631" r="15" fill="#2d64aa"/><text x="1692.0" y="637" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">S</text><circle cx="1660" cy="631" r="15" fill="#31865b"/><text x="1653.0" y="637" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">O</text><circle cx="1622" cy="631" r="15" fill="#b77a1d"/><text x="1616.5" y="637" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">L</text><rect x="1308" y="835" width="414" height="150" rx="0" fill="white" stroke="#718195" stroke-width="2"/><text x="1422.0" y="859" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#65768c">[Solo pruebas de contrato]</text><text x="1388.5" y="890" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">PesajesMemoriaAdapter</text><polyline points="1308,905 1722,905" fill="none" stroke="#6b7d93" stroke-width="3"/><text x="1320" y="940" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Mismas respuestas y errores básicos</text><text x="1320" y="964" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">No sustituye pruebas de concurrencia</text><circle cx="1698" cy="816" r="15" fill="#31865b"/><text x="1691.0" y="822" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">O</text><circle cx="1660" cy="816" r="15" fill="#b77a1d"/><text x="1654.5" y="822" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">L</text><rect x="1308" y="1045" width="414" height="145" rx="0" fill="white" stroke="#718195" stroke-width="2"/><text x="1436.5" y="1069" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#65768c">[Adaptador propuesto]</text><text x="1347.5078125" y="1100" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">TransaccionPostgreSQLAdapter</text><polyline points="1308,1115 1722,1115" fill="none" stroke="#6b7d93" stroke-width="3"/><text x="1320" y="1150" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Implementa unidad de trabajo</text><text x="1320" y="1174" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Transacción, bloqueo y rollback</text><circle cx="1698" cy="1026" r="15" fill="#2d64aa"/><text x="1692.0" y="1032" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">S</text><circle cx="1660" cy="1026" r="15" fill="#31865b"/><text x="1653.0" y="1032" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">O</text><rect x="1308" y="1290" width="414" height="150" rx="0" fill="white" stroke="#718195" stroke-width="2"/><text x="1412.0078125" y="1314" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#65768c">[Adaptación de AuditService]</text><text x="1368.0" y="1345" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">AuditoriaPersistenteAdapter</text><polyline points="1308,1360 1722,1360" fill="none" stroke="#6b7d93" stroke-width="3"/><text x="1320" y="1395" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Conserva hechos en la transacción</text><text x="1320" y="1419" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">No borra ni altera eventos confirmados</text><circle cx="1698" cy="1271" r="15" fill="#2d64aa"/><text x="1692.0" y="1277" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">S</text><circle cx="1660" cy="1271" r="15" fill="#31865b"/><text x="1653.0" y="1277" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">O</text><polyline points="364,452 450,452" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="450,452 434.4774880146908,458.9319277020127 434.4774880146908,445.0680722979873" fill="#6b7d93"/><polyline points="780,450 868,450" fill="none" stroke="#6b7d93" stroke-width="3" stroke-dasharray="10 8"/><polygon points="868,450 852.4774880146907,456.9319277020127 852.4774880146907,443.0680722979873" fill="#6b7d93"/><text x="795" y="431" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#20344c">usa</text><polyline points="780,525 822,525 822,720 868,720" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="868,720 852.4774880146907,726.9319277020127 852.4774880146907,713.0680722979873" fill="#6b7d93"/><polyline points="780,580 822,580 822,1025 868,1025" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="868,1025 852.4774880146907,1031.9319277020127 852.4774880146907,1018.0680722979873" fill="#6b7d93"/><polyline points="780,635 822,635 822,1300 868,1300" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="868,1300 852.4774880146907,1306.9319277020127 852.4774880146907,1293.0680722979873" fill="#6b7d93"/><polyline points="1308,725 1260,725 1260,725 1222,725" fill="none" stroke="#8052ac" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1222,725 1237.5225119853092,718.0680722979873 1237.5225119853092,731.9319277020127" fill="#8052ac"/><polyline points="1308,910 1260,910 1260,765 1222,765" fill="none" stroke="#8052ac" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1222,765 1237.5225119853092,758.0680722979873 1237.5225119853092,771.9319277020127" fill="#8052ac"/><polyline points="1308,1115 1260,1115 1260,1025 1222,1025" fill="none" stroke="#8052ac" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1222,1025 1237.5225119853092,1018.0680722979873 1237.5225119853092,1031.9319277020127" fill="#8052ac"/><polyline points="1308,1365 1260,1365 1260,1300 1222,1300" fill="none" stroke="#8052ac" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1222,1300 1237.5225119853092,1293.0680722979873 1237.5225119853092,1306.9319277020127" fill="#8052ac"/><rect x="72" y="880" width="292" height="250" rx="0" fill="#fff7d9" stroke="#ceb65a" stroke-width="2"/><text x="85" y="919" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Composición propuesta:</text><text x="85" y="945" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">reception.module.ts conecta el</text><text x="85" y="971" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">caso de uso con adaptadores.</text><text x="85" y="997" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Hoy WeighingService recibe</text><text x="85" y="1023" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">DataSource y AuditService</text><text x="85" y="1049" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">directamente; no se declara</text><text x="85" y="1075" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">DIP completo.</text><rect x="450" y="1170" width="330" height="236" rx="0" fill="#e4f0e6" stroke="#6e9a78" stroke-width="2"/><text x="463" y="1206" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Una orden repetida recupera el</text><text x="463" y="1231" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">mismo saco. Una recepción</text><text x="463" y="1256" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">cerrada o versión desactualizada</text><text x="463" y="1281" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">exige revisión. Offline: cola cifrada</text><text x="463" y="1306" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">del cliente; la API revalida</text><text x="463" y="1331" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">permisos al sincronizar. Sin</text><text x="463" y="1356" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">inventario.</text><circle cx="90" cy="1592" r="15" fill="#2d64aa"/><text x="84.0" y="1598" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">S</text><text x="117" y="1600" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Responsabilidad única: entrada, reglas y persistencia</text><circle cx="90" cy="1639" r="15" fill="#31865b"/><text x="83.0" y="1645" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">O</text><text x="117" y="1647" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Abierto/cerrado: extender adaptadores por contrato</text><circle cx="90" cy="1686" r="15" fill="#b77a1d"/><text x="84.5" y="1692" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">L</text><text x="117" y="1694" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Sustitución: conservar resultados, errores e invariantes</text><circle cx="970" cy="1592" r="15" fill="#8052ac"/><text x="967.5" y="1598" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">I</text><text x="997" y="1600" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Interfaces pequeñas para cada necesidad</text><circle cx="970" cy="1639" r="15" fill="#b34a40"/><text x="963.5" y="1645" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">D</text><text x="997" y="1647" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Caso de uso depende de contratos, no del ORM</text><rect x="54" y="1786" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="1824" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">S identifica responsabilidades concretas. O/L/I/D se muestran como dirección de diseño de la extracción propuesta. El código actual contiene reglas y transacciones, pero</text><text x="76" y="1852" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">no implementa todos estos puertos. Validar precisión, UUID, permisos, versión, recuperación y atomicidad antes de declarar convergencia.</text><text x="62" y="1916" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  16 historias  ·  8 módulos  ·  Sin saldo de mercadería</text></svg>