<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1840" viewBox="0 0 1800 1840" role="img"><title>Diagrama de contenedores · Mercado</title><desc>Modelo C4 · Nivel 2 · Aplicaciones, almacenes de datos y relaciones del sistema</desc><rect width="1800" height="1840" fill="#f7f9fc"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#14283f" stroke="none" stroke-width="2"/><text x="64" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">Diagrama de contenedores · Mercado</text><text x="64" y="114" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#c8d8e9">Modelo C4 · Nivel 2 · Aplicaciones, almacenes de datos y relaciones del sistema</text><circle cx="455" cy="217" r="27" fill="#284f87"/><rect x="280" y="247" width="350" height="162" rx="12" fill="#dce7f8" stroke="#284f87" stroke-width="2"/><text x="396.5" y="289" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#20344c">Mayorista</text><text x="419.0" y="320" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#20344c">[Persona]</text><text x="331.0" y="359" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Gestiona el negocio y sus</text><text x="423.5" y="386" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">saldos</text><circle cx="1095" cy="217" r="27" fill="#284f87"/><rect x="920" y="247" width="350" height="162" rx="12" fill="#dce7f8" stroke="#284f87" stroke-width="2"/><text x="1030.5" y="289" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#20344c">Encargado</text><text x="1059.0" y="320" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#20344c">[Persona]</text><text x="965.5" y="359" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Pesajes, compras y ventas</text><text x="1039.0" y="386" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">autorizadas</text><polyline points="455,409 455,459 790,459" fill="none" stroke="#6b7d93" stroke-width="3"/><polyline points="1095,409 1095,459 790,459 790,570" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="790,570 783.0680722979873,554.4774880146907 796.9319277020127,554.4774880146907" fill="#6b7d93"/><rect x="609.0" y="477" width="362.0" height="28" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="615.0" y="500" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Usan la aplicación [interacción táctil]</text><polyline points="65,520 1365,520 1365,1540 65,1540 65,520" fill="none" stroke="#8a96a5" stroke-width="3" stroke-dasharray="10 8"/><text x="85" y="555" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20344c">Mercado  [Sistema de software en alcance]</text><polyline points="93,588 1331,588 1331,888 93,888 93,588" fill="none" stroke="#8a96a5" stroke-width="3" stroke-dasharray="10 8"/><text x="109" y="620" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#52677f">Dispositivo Android · cliente y almacén local</text><rect x="475" y="646" width="575" height="182" rx="12" fill="#dcebf9" stroke="#2267ad" stroke-width="2"/><text x="648.5078125" y="688" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#20344c">Aplicación Android</text><text x="586.5078125" y="719" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#20344c">[Contenedor: Expo / React Native / TypeScript]</text><text x="762.5" y="758" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c" text-anchor="middle">Captura de pesos y operaciones; sesión, consultas,</text><text x="762.5" y="785" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c" text-anchor="middle">documentos y envío por WhatsApp o correo.</text><rect x="120" y="646" width="295" height="182" rx="12" fill="#fff0d9" stroke="#a26719" stroke-width="2"/><text x="183.5" y="688" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#20344c">Almacén local</text><text x="177.5" y="719" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#20344c">[Datos en el dispositivo]</text><text x="190.0" y="758" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Sesión segura y</text><text x="155.0" y="785" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">pendientes cifrados por</text><text x="179.5" y="812" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">usuario y negocio.</text><polyline points="475,741 415,741" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="415,741 430.5225119853092,734.0680722979873 430.5225119853092,747.9319277020127" fill="#6b7d93"/><rect x="171.5" y="860" width="251.0" height="28" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="177.5" y="880" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Guarda / recupera pendientes</text><polyline points="762,828 762,965" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="762,965 755.0680722979873,949.4774880146907 768.9319277020127,949.4774880146907" fill="#6b7d93"/><rect x="853.5" y="903" width="283.0" height="28" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="859.5" y="925" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">HTTPS / JSON · REST /api/v1</text><rect x="475" y="965" width="575" height="220" rx="12" fill="#dcebf9" stroke="#2267ad" stroke-width="2"/><text x="686.5" y="1007" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#20344c">API Mercado</text><text x="634.0078125" y="1038" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#20344c">[Contenedor: NestJS / TypeScript]</text><text x="762.5" y="1077" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c" text-anchor="middle">Monolito modular con ocho módulos: identidad,</text><text x="762.5" y="1104" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c" text-anchor="middle">compras, ventas, cuentas, costos, documentos,</text><text x="762.5" y="1131" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c" text-anchor="middle">mensajería y reportes.</text><polyline points="762,1185 762,1315" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="762,1315 755.0680722979873,1299.4774880146908 768.9319277020127,1299.4774880146908" fill="#6b7d93"/><rect x="884.5" y="1234" width="201.0" height="28" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="890.5" y="1257" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Lee y escribe [SQL]</text><rect x="465" y="1333" width="595" height="160" rx="0" fill="#fff0d9" stroke="#a26719" stroke-width="2"/><ellipse cx="762.5" cy="1493" rx="297.5" ry="18" fill="#fff0d9" stroke="#a26719" stroke-width="2"/><ellipse cx="762.5" cy="1333" rx="297.5" ry="18" fill="#fff0d9" stroke="#a26719" stroke-width="2"/><text x="645.5" y="1383" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#20344c">PostgreSQL central</text><text x="625.0" y="1413" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#20344c">[Contenedor: almacén transaccional]</text><text x="762.5" y="1445" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c" text-anchor="middle">Operaciones, saldos, auditoría, PDF</text><text x="762.5" y="1470" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c" text-anchor="middle">e intentos de envío.</text><rect x="1430" y="646" width="315" height="224" rx="12" fill="#edf0f5" stroke="#54657b" stroke-width="2"/><text x="1588" y="688" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#20344c" text-anchor="middle">WhatsApp / correo</text><text x="1521.5" y="719" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#20344c">[Sistema externo]</text><text x="1588" y="758" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c" text-anchor="middle">Recibe el documento que el</text><text x="1588" y="785" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c" text-anchor="middle">Mayorista envía desde</text><text x="1588" y="812" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c" text-anchor="middle">Android.</text><polyline points="1050,728 1430,728" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1430,728 1414.4774880146908,734.9319277020127 1414.4774880146908,721.0680722979873" fill="#6b7d93"/><rect x="1124.5" y="689" width="231.0" height="28" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="1130.5" y="709" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Envía documento elegido</text><text x="1437" y="1050" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#20344c">Envío manual:</text><text x="1437" y="1082" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">el Mayorista confirma el</text><text x="1437" y="1111" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">contacto en WhatsApp o correo.</text><rect x="95" y="1590" width="21" height="21" rx="4" fill="#284f87" stroke="none" stroke-width="2"/><text x="130" y="1605" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Persona</text><rect x="515" y="1590" width="21" height="21" rx="4" fill="#2267ad" stroke="none" stroke-width="2"/><text x="550" y="1605" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Aplicación / API</text><rect x="935" y="1590" width="21" height="21" rx="4" fill="#a26719" stroke="none" stroke-width="2"/><text x="970" y="1605" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Almacén de datos</text><rect x="1355" y="1590" width="21" height="21" rx="4" fill="#54657b" stroke="none" stroke-width="2"/><text x="1390" y="1605" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Sistema externo</text><rect x="54" y="1686" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="1724" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">PostgreSQL es la autoridad central; la tablet no accede por SQL. La cola local no es una base oficial de saldos. El PDF se conserva en PostgreSQL y se entrega por la</text><text x="76" y="1752" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">API con autorización. No hay Redis, broker, pasarela de pagos, ERP, courier ni inventario añadidos a esta vista.</text><text x="62" y="1816" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  16 historias  ·  8 módulos  ·  Sin saldo de mercadería</text></svg>