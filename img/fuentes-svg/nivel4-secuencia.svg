="619" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Transacción + bloqueo por</text><text x="1328.5" y="643" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">negocio/UUID</text><polyline points="1220,745 1570,745" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1570,745 1554.4774880146908,751.9319277020127 1554.4774880146908,738.0680722979873" fill="#6b7d93"/><text x="1269.0" y="738" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Consultar resultado previo</text><rect x="1090" y="785" width="650" height="440" rx="0" fill="none" stroke="#71509a" stroke-width="2"/><rect x="1090" y="785" width="235" height="40" rx="0" fill="#f0e9fb" stroke="none" stroke-width="2"/><text x="1105" y="810" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#71509a">alt · UUID repetido</text><polyline points="1570,855 1220,855" fill="none" stroke="#6b7d93" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1220,855 1235.5225119853092,848.0680722979873 1235.5225119853092,861.9319277020127" fill="#6b7d93"/><text x="1244.0" y="848" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Recuperar liquidación existente</text><polyline points="1090,900 1740,900" fill="none" stroke="#6b7d93" stroke-width="3" stroke-dasharray="10 8"/><text x="1105" y="929" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#71509a">else · orden nueva</text><polyline points="1220,985 1570,985" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1570,985 1554.4774880146908,991.9319277020127 1554.4774880146908,978.0680722979873" fill="#6b7d93"/><text x="1265.0078125" y="978" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Validar recepción y versión</text><rect x="1120" y="1010" width="580" height="55" rx="8" fill="#f0e9fb" stroke="none" stroke-width="2"/><text x="1135" y="1045" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#71509a">Calcular importes con precisión aprobada</text><polyline points="1220,1120 1570,1120" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1570,1120 1554.4774880146908,1126.9319277020127 1554.4774880146908,1113.0680722979873" fill="#6b7d93"/><text x="1252.5" y="1089" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Guardar compra, cuenta/caja,</text><text x="1310.0" y="1113" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">costos y auditoría</text><polyline points="1570,1200 1220,1200" fill="none" stroke="#6b7d93" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1220,1200 1235.5225119853092,1193.0680722979873 1235.5225119853092,1206.9319277020127" fill="#6b7d93"/><text x="1263.5" y="1193" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Confirmar efectos atómicos</text><polyline points="1220,1300 870,1300" fill="none" stroke="#6b7d93" stroke-width="3" stroke-dasharray="10 8"/><polygon points="870,1300 885.5225119853093,1293.0680722979873 885.5225119853093,1306.9319277020127" fill="#6b7d93"/><text x="947.0" y="1293" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Resultado persistido</text><polyline points="870,1380 520,1380" fill="none" stroke="#6b7d93" stroke-width="3" stroke-dasharray="10 8"/><polygon points="520,1380 535.5225119853093,1373.0680722979873 535.5225119853093,1386.9319277020127" fill="#6b7d93"/><text x="558.5" y="1373" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Resultado o error controlado</text><polyline points="520,1460 170,1460" fill="none" stroke="#6b7d93" stroke-width="3" stroke-dasharray="10 8"/><polygon points="170,1460 185.52251198530925,1453.0680722979873 185.52251198530925,1466.9319277020127" fill="#6b7d93"/><text x="207.5" y="1429" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Mostrar estado confirmado o</text><text x="307.5" y="1453" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">revisión</text><rect x="54" y="1546" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="1584" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Sin red: conservar pendiente. UUID repetido: devolver resultado previo. Versión incompatible: revisión (409). Error transaccional: rollback. Ninguna rama valida ni</text><text x="76" y="1612" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">descuenta existencias.</text><text x="62" y="1676" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  14 historias  ·  Sin saldo de mercadería</text></svg>