<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img"><title>Diagrama de contexto del sistema · Mercado</title><desc>Modelo C4 · Nivel 1 · Quién usa el sistema y con qué sistemas externos se relaciona</desc><rect width="1800" height="1420" fill="#f7f9fc"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#14283f" stroke="none" stroke-width="2"/><text x="64" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">Diagrama de contexto del sistema · Mercado</text><text x="64" y="114" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#c8d8e9">Modelo C4 · Nivel 1 · Quién usa el sistema y con qué sistemas externos se relaciona</text><circle cx="410" cy="244" r="33" fill="#284f87"/><rect x="220" y="280" width="380" height="202" rx="14" fill="#dce7f8" stroke="#284f87" stroke-width="2"/><text x="346.5" y="327" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20344c">Mayorista</text><text x="371.5" y="359" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">[Persona]</text><text x="269.5" y="399" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#20344c">Gestiona las operaciones y</text><text x="285.0" y="428" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#20344c">saldos financieros de su</text><text x="369.0" y="457" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#20344c">negocio</text><circle cx="1390" cy="244" r="33" fill="#284f87"/><rect x="1200" y="280" width="380" height="202" rx="14" fill="#dce7f8" stroke="#284f87" stroke-width="2"/><text x="1319.0" y="327" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20344c">Encargado</text><text x="1351.5" y="359" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">[Persona]</text><text x="1243.0" y="399" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#20344c">Registra pesajes, compras y</text><text x="1255.5" y="428" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#20344c">ventas durante reemplazo</text><text x="1335.5" y="457" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#20344c">autorizado</text><rect x="500" y="650" width="800" height="227" rx="14" fill="#dcebf9" stroke="#2267ad" stroke-width="2"/><text x="656.0" y="697" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20344c">Mercado · Gestión mayorista de papa</text><text x="767.5" y="729" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">[Sistema de software en alcance]</text><text x="548.0" y="769" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#20344c">Registra recepción, pesos, compras, ventas y despachos. Conserva</text><text x="900" y="798" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#20344c" text-anchor="middle">historial, pagos, deudas, costos, comprobantes y estados de cuenta.</text><polyline points="410,482 410,750 500,750" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="500,750 484.4774880146908,756.9319277020127 484.4774880146908,743.0680722979873" fill="#6b7d93"/><polyline points="1390,482 1390,750 1300,750" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1300,750 1315.5225119853092,743.0680722979873 1315.5225119853092,756.9319277020127" fill="#6b7d93"/><text x="131.5" y="572" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Registra y supervisa</text><text x="83.5" y="601" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">operaciones; consulta cuentas</text><text x="124.0" y="630" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">y autoriza reemplazos</text><text x="1477.5" y="572" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Registra operaciones</text><text x="1442.5" y="601" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">comerciales según permisos</text><text x="1460.5" y="630" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">y vigencia del reemplazo</text><rect x="660" y="1020" width="480" height="172" rx="14" fill="#edf0f5" stroke="#54657b" stroke-width="2"/><text x="900" y="1067" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20344c" text-anchor="middle">WhatsApp / correo</text><text x="900" y="1099" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c" text-anchor="middle">[Sistema externo · envío manual]</text><text x="900" y="1139" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#20344c" text-anchor="middle">Hace llegar comprobantes y estados de</text><text x="900" y="1168" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#20344c" text-anchor="middle">cuenta al comprador o proveedor.</text><polyline points="900,877 900,1020" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,1020 893.0680722979873,1004.4774880146907 906.9319277020127,1004.4774880146907" fill="#6b7d93"/><text x="1190" y="943" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c" text-anchor="middle">Envía comprobantes y estados de cuenta</text><text x="1190" y="971" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c" text-anchor="middle">El Mayorista confirma el envío</text><rect x="220" y="1230" width="22" height="22" rx="4" fill="#284f87" stroke="none" stroke-width="2"/><text x="255" y="1249" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Persona usuaria</text><rect x="740" y="1230" width="22" height="22" rx="4" fill="#2267ad" stroke="none" stroke-width="2"/><text x="775" y="1249" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Sistema en alcance</text><rect x="1260" y="1230" width="22" height="22" rx="4" fill="#54657b" stroke="none" stroke-width="2"/><text x="1295" y="1249" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Sistema externo</text><rect x="54" y="1266" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="1304" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Se conservan cantidades y pesos por operación, sin inventario ni saldo de mercadería. Proveedores, compradores, conductores y estibadores son participantes</text><text x="76" y="1332" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">registrados, no cuentas de acceso. Las tecnologías y los módulos internos se detallan en los niveles C4 siguientes.</text><text x="62" y="1396" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  16 historias  ·  8 módulos  ·  Sin saldo de mercadería</text></svg>