-size="24" font-weight="bold" fill="#24364b">Pendientes locales</text><text x="1230" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">Continuidad sin conexión</text><rect x="570.0" y="590.0" width="360" height="140" rx="18" fill="white" stroke="#2f7154" stroke-width="3"/><text x="750" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#24364b">Negocio y REST</text><text x="750" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">Autorización, cálculo y</text><text x="750" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">transacciones</text><rect x="1050.0" y="590.0" width="360" height="140" rx="18" fill="white" stroke="#2f7154" stroke-width="3"/><text x="1230" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#24364b">PostgreSQL</text><text x="1230" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">Operaciones y saldos confirmados</text><rect x="90.0" y="590.0" width="360" height="140" rx="18" fill="white" stroke="#2f7154" stroke-width="3"/><text x="270" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#24364b">PDF y reportes</text><text x="270" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">Información comercial trazable</text><text x="65" y="920" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">Los pendientes llegan a la base exclusivamente mediante la API y su revalidación; no existe conexión SQL desde</text><text x="65" y="947" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">el dispositivo.</text><text x="65" y="983" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#5a6a7b">MERCADO · Gestión mayorista de papa · Primer entregable</text></svg>