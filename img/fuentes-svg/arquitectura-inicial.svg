<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1770" viewBox="0 0 1800 1770" role="img"><title>Arquitectura inicial · Mercado</title><desc>Gestión mayorista de papa · Organización documental vigente · 13 de octubre de 2026</desc><rect width="1800" height="1770" fill="#f7f9fc"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#14283f" stroke="none" stroke-width="2"/><text x="64" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">Arquitectura inicial · Mercado</text><text x="64" y="114" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#c8d8e9">Gestión mayorista de papa · Organización documental vigente · 13 de octubre de 2026</text><rect x="120" y="215" width="680" height="130" rx="16" fill="#e6edf9" stroke="#365c9d" stroke-width="2"/><text x="138" y="258" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#365c9d">Mayorista</text><text x="138" y="300" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Acceso integral al negocio</text><rect x="1000" y="215" width="680" height="130" rx="16" fill="#e6edf9" stroke="#365c9d" stroke-width="2"/><text x="1018" y="258" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#365c9d">Encargado</text><text x="1018" y="300" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Pesaje, compra y venta con reemplazo vigente</text><rect x="440" y="425" width="920" height="140" rx="16" fill="#e1effb" stroke="#2865b0" stroke-width="2"/><text x="458" y="468" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2865b0">Aplicación Android y entrada REST</text><text x="458" y="510" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Expo / React Native comunica órdenes a la API NestJS por HTTPS / JSON.</text><polyline points="460,345 460,385 900,385 900,425" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,425 893.0680722979873,409.4774880146908 906.9319277020127,409.4774880146908" fill="#6b7d93"/><polyline points="1340,345 1340,385 900,385" fill="none" stroke="#6b7d93" stroke-width="3"/><rect x="90" y="645" width="1620" height="705" rx="0" fill="none" stroke="#53647c" stroke-width="2" stroke-dasharray="8 6"/><text x="120" y="691" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#20344c">API Mercado · Monolito modular · Responsabilidades de negocio</text><polyline points="900,565 900,645" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,645 893.0680722979873,629.4774880146907 906.9319277020127,629.4774880146907" fill="#6b7d93"/><rect x="125" y="735" width="510" height="155" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="143" y="778" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Identidad y reemplazos</text><text x="143" y="820" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">HU07 / HU12: sesión y acceso autorizado</text><rect x="665" y="735" width="510" height="155" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="683" y="778" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Recepción y pesaje</text><text x="683" y="820" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">HU01: proveedor, variedad, vehículo y pesos</text><rect x="1205" y="735" width="510" height="155" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="1223" y="778" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Compras</text><text x="1223" y="820" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">HU02: proveedor, precio, flete y líquido</text><rect x="125" y="925" width="510" height="155" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="143" y="968" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Ventas y despachos</text><text x="143" y="1010" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">HU03: comprador, variedad, destino y transporte</text><rect x="665" y="925" width="510" height="155" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="683" y="968" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Cuentas y caja</text><text x="683" y="1010" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">HU04 / HU08: obligaciones, abonos y saldos</text><rect x="1205" y="925" width="510" height="155" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="1223" y="968" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Flete y estiba</text><text x="1223" y="1010" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">HU09: costos y liquidación por grupo</text><rect x="125" y="1115" width="510" height="155" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="143" y="1158" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Historial y PDF</text><text x="143" y="1200" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">HU10 / HU11: búsqueda y comprobantes</text><rect x="665" y="1115" width="510" height="155" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="683" y="1158" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Auditoría</text><text x="683" y="1200" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">HU13: responsable, acción, fecha y motivo</text><rect x="1205" y="1115" width="510" height="155" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="1223" y="1158" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Analítica y avisos</text><text x="1223" y="1200" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">HU06 / HU14: tendencias y vencimientos</text><polyline points="900,1350 900,1410" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,1410 893.0680722979873,1394.4774880146908 906.9319277020127,1394.4774880146908" fill="#6b7d93"/><rect x="440" y="1410" width="920" height="130" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="458" y="1453" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">PostgreSQL central</text><text x="458" y="1495" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Operaciones, pesos, finanzas, auditoría y contenido PDF.</text><rect x="54" y="1616" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="1654" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Proveedores, variedades y transporte pertenecen a cada operación. Se conservan los requisitos y saldos financieros. No hay módulos independientes de datos</text><text x="76" y="1682" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">comerciales ni control de existencias. Todos los módulos backend se despliegan juntos.</text><text x="62" y="1746" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  14 historias  ·  Sin saldo de mercadería</text></svg>