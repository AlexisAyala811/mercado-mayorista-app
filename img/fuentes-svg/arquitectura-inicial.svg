<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1720" viewBox="0 0 1800 1720" role="img"><title>Arquitectura inicial · Mercado</title><desc>Vista general de aplicaciones, negocio y datos · Organización vigente al 13 de octubre de 2026</desc><rect width="1800" height="1720" fill="#f7f9fc"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#14283f" stroke="none" stroke-width="2"/><text x="64" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">Arquitectura inicial · Mercado</text><text x="64" y="114" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#c8d8e9">Vista general de aplicaciones, negocio y datos · Organización vigente al 29 de octubre de 2026</text><rect x="460" y="200" width="880" height="125" rx="16" fill="#e6edf9" stroke="#365c9d" stroke-width="2"/><text x="478" y="240" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#365c9d">Mayorista y Encargado</text><text x="478" y="278" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Acceso completo o registro con reemplazo vigente.</text><rect x="460" y="405" width="880" height="135" rx="16" fill="#e1effb" stroke="#2865b0" stroke-width="2"/><text x="478" y="445" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2865b0">Aplicación Android</text><text x="478" y="483" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Captura táctil, sesión, resultados y compartición PDF.</text><rect x="45" y="405" width="360" height="170" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="63" y="445" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">Almacén local cifrado</text><text x="63" y="483" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Cola y sincronización: órdenes</text><text x="63" y="509" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">pendientes por usuario y</text><text x="63" y="535" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">negocio.</text><rect x="1395" y="405" width="360" height="170" rx="16" fill="#efe7f8" stroke="#7950a8" stroke-width="2"/><text x="1413" y="445" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7950a8">WhatsApp / correo</text><text x="1413" y="483" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Envío manual de PDF, estados</text><text x="1413" y="509" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">de cuenta e imágenes.</text><polyline points="900,325 900,405" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,405 893.0680722979873,389.4774880146908 906.9319277020127,389.4774880146908" fill="#6b7d93"/><polyline points="900,540 900,745" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,745 893.0680722979873,729.4774880146907 906.9319277020127,729.4774880146907" fill="#6b7d93"/><polyline points="460,470 405,470" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="405,470 420.5225119853092,463.0680722979873 420.5225119853092,476.9319277020127" fill="#6b7d93"/><polyline points="1340,470 1395,470" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1395,470 1379.4774880146908,476.9319277020127 1379.4774880146908,463.0680722979873" fill="#6b7d93"/><rect x="1051.0" y="609" width="138.0" height="26" rx="3" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="1059.0" y="629" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">HTTPS / JSON</text><rect x="250" y="660" width="1300" height="635" rx="0" fill="none" stroke="#53647c" stroke-width="2" stroke-dasharray="8 6"/><text x="280" y="703" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20344c">API NestJS · Monolito modular en capas</text><rect x="315" y="745" width="1170" height="135" rx="16" fill="#e1effb" stroke="#2865b0" stroke-width="2"/><text x="333" y="785" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2865b0">Presentación y autorización</text><text x="333" y="823" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">REST /api/v1, contratos, sesión, negocio, rol y reemplazo.</text><rect x="315" y="925" width="1170" height="195" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="333" y="965" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Aplicación y reglas comerciales</text><text x="333" y="1003" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Ocho módulos: identidad y acceso; recepción y compras; ventas y despachos; cuentas y caja;</text><text x="333" y="1029" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">costos logísticos; documentos; mensajería; reportes y analítica.</text><rect x="315" y="1165" width="1170" height="105" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="333" y="1205" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">Persistencia</text><text x="333" y="1243" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Repositorios y transacciones coordinadas.</text><polyline points="900,880 900,925" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,925 893.0680722979873,909.4774880146907 906.9319277020127,909.4774880146907" fill="#6b7d93"/><polyline points="900,1120 900,1165" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,1165 893.0680722979873,1149.4774880146908 906.9319277020127,1149.4774880146908" fill="#6b7d93"/><polyline points="900,1295 900,1380" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,1380 893.0680722979873,1364.4774880146908 906.9319277020127,1364.4774880146908" fill="#6b7d93"/><rect x="460" y="1380" width="880" height="130" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="478" y="1420" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">PostgreSQL</text><text x="478" y="1458" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Operaciones, pesos, saldos financieros, auditoría y PDF.</text><rect x="54" y="1566" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="1604" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">La vista general no detalla las colaboraciones de cada módulo: se abren en C4 nivel 3. Android y API son aplicaciones separadas. Documentos genera</text><text x="76" y="1632" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">los archivos y Mensajería registra su envío. No hay cálculo de existencias.</text><text x="62" y="1696" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  16 historias  ·  8 módulos  ·  Sin saldo de mercadería</text></svg>