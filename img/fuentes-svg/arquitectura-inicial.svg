<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2190" viewBox="0 0 1800 2190" role="img"><title>Arquitectura inicial · Gestión mayorista de papa</title><desc>Actores, presentación, negocio, datos e interacción externa · Alcance sin inventario</desc><rect width="1800" height="2190" fill="#f7f9fc"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#14283f" stroke="none" stroke-width="2"/><text x="64" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">Arquitectura inicial · Gestión mayorista de papa</text><text x="64" y="114" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#c8d8e9">Actores, presentación, negocio, datos e interacción externa · Alcance sin inventario</text><rect x="400" y="215" width="980" height="204" rx="16" fill="#e6edf9" stroke="#365c9d" stroke-width="2"/><rect x="402" y="217" width="976" height="53" rx="10" fill="#365c9d" stroke="none" stroke-width="2"/><text x="831.5" y="251" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white">ACTORES</text><rect x="445" y="286" width="390" height="111" rx="9" fill="white" stroke="#365c9d" stroke-width="2"/><text x="586.0" y="322" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Mayorista</text><text x="495.5" y="352" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Gestiona y supervisa su negocio</text><rect x="945" y="286" width="390" height="111" rx="9" fill="white" stroke="#365c9d" stroke-width="2"/><text x="1080.5" y="322" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Encargado</text><text x="976.0" y="352" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Opera durante reemplazo autorizado</text><polyline points="640,419 640,458 665,458 665,505" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="665,505 658.0680722979873,489.4774880146908 671.9319277020127,489.4774880146908" fill="#6b7d93"/><polyline points="1140,419 1140,458 665,458" fill="none" stroke="#6b7d93" stroke-width="3"/><rect x="360" y="505" width="1060" height="260" rx="16" fill="#e1effb" stroke="#367eb0" stroke-width="2"/><rect x="362" y="507" width="1056" height="53" rx="10" fill="#367eb0" stroke="none" stroke-width="2"/><text x="659.0390625" y="541" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white">PRESENTACIÓN Y ENTRADA DE LA API</text><rect x="405" y="586" width="460" height="146" rx="9" fill="white" stroke="#367eb0" stroke-width="2"/><text x="530.0078125" y="622" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Aplicación Android</text><text x="439.0" y="652" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Expo / React Native. Captura táctil, sesión y</text><text x="597.0" y="676" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">estados.</text><rect x="945" y="586" width="430" height="146" rx="9" fill="white" stroke="#367eb0" stroke-width="2"/><text x="1069.0" y="622" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">API REST /api/v1</text><text x="1005.5" y="652" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">NestJS. Identidad, negocio, DTO y</text><text x="1103.5" y="676" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">autorización.</text><polyline points="865,660 945,660" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="945,660 929.4774880146907,666.9319277020127 929.4774880146907,653.0680722979873" fill="#6b7d93"/><rect x="832.5" y="742" width="147.0" height="28" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="838.5" y="764" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">HTTPS / JSON</text><rect x="35" y="555" width="285" height="215" rx="16" fill="#fff0d4" stroke="#b37c23" stroke-width="2"/><rect x="37" y="557" width="281" height="53" rx="10" fill="#b37c23" stroke="none" stroke-width="2"/><text x="74.515625" y="591" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white">DATOS LOCALES</text><rect x="55" y="628" width="245" height="125" rx="9" fill="white" stroke="#b37c23" stroke-width="2"/><text x="111.5" y="664" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Cola cifrada</text><text x="75.0" y="694" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Pendientes por usuario</text><text x="135.0" y="718" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">y negocio</text><polyline points="405,660 320,660" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="320,660 335.5225119853092,653.0680722979873 335.5225119853092,666.9319277020127" fill="#6b7d93"/><rect x="70.5" y="799" width="283.0" height="28" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="76.5" y="821" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Guarda y recupera pendientes</text><polyline points="1160,765 1160,816 890,816 890,865" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="890,865 883.0680722979873,849.4774880146907 896.9319277020127,849.4774880146907" fill="#6b7d93"/><rect x="818.0" y="788" width="294.0" height="28" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="824.0" y="810" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Invoca operaciones autorizadas</text><rect x="360" y="865" width="1060" height="653" rx="16" fill="#e6f4e8" stroke="#32865a" stroke-width="2"/><rect x="362" y="867" width="1056" height="53" rx="10" fill="#32865a" stroke="none" stroke-width="2"/><text x="621.5078125" y="901" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white">LÓGICA DE NEGOCIO · MONOLITO MODULAR</text><rect x="390" y="952" width="310" height="147" rx="9" fill="white" stroke="#32865a" stroke-width="2"/><text x="418.0" y="988" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Identidad y reemplazos</text><text x="421.5" y="1018" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Sesión, permisos y vigencia</text><rect x="730" y="952" width="310" height="147" rx="9" fill="white" stroke="#32865a" stroke-width="2"/><text x="770.0" y="988" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Catálogos y logística</text><text x="765.0" y="1018" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Participantes, variedades y</text><text x="843.0" y="1042" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">vehículos</text><rect x="1070" y="952" width="310" height="147" rx="9" fill="white" stroke="#32865a" stroke-width="2"/><text x="1118.0" y="988" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Recepción y pesaje</text><text x="1088.0" y="1018" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Sacos, tara, peso neto y cierre</text><rect x="390" y="1128" width="310" height="147" rx="9" fill="white" stroke="#32865a" stroke-width="2"/><text x="495.0" y="1164" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Compras</text><text x="403.0" y="1194" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Precio, flete, adelantos y líquido</text><rect x="730" y="1128" width="310" height="147" rx="9" fill="white" stroke="#32865a" stroke-width="2"/><text x="774.0078125" y="1164" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Ventas y despachos</text><text x="759.5" y="1194" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Registro comercial y destino</text><rect x="1070" y="1128" width="310" height="147" rx="9" fill="white" stroke="#32865a" stroke-width="2"/><text x="1144.0" y="1164" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Cuentas y caja</text><text x="1117.5" y="1194" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Pagos, cobros, cuotas y</text><text x="1192.5" y="1218" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">deudas</text><rect x="390" y="1304" width="310" height="147" rx="9" fill="white" stroke="#32865a" stroke-width="2"/><text x="472.0" y="1340" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Flete y estiba</text><text x="411.0" y="1370" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Costos y liquidación por grupo</text><rect x="730" y="1304" width="310" height="147" rx="9" fill="white" stroke="#32865a" stroke-width="2"/><text x="747.0" y="1340" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Historial y comprobantes</text><text x="767.0" y="1370" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Búsqueda, reportes y PDF</text><text x="854.5" y="1394" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">interno</text><rect x="1070" y="1304" width="310" height="147" rx="9" fill="white" stroke="#32865a" stroke-width="2"/><text x="1116.0" y="1340" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">Auditoría y analítica</text><text x="1128.0078125" y="1370" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Trazabilidad y análisis</text><text x="1167.0" y="1394" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">condicionado</text><polyline points="890,1518 890,1640" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="890,1640 883.0680722979873,1624.4774880146908 896.9319277020127,1624.4774880146908" fill="#6b7d93"/><rect x="891.5078125" y="1570" width="246.984375" height="28" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="897.5078125" y="1592" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Transacciones y consultas</text><rect x="530" y="1640" width="850" height="228" rx="16" fill="#fff0d4" stroke="#b37c23" stroke-width="2"/><rect x="532" y="1642" width="846" height="53" rx="10" fill="#b37c23" stroke="none" stroke-width="2"/><text x="836.515625" y="1676" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white">DATOS CENTRALES</text><rect x="565" y="1723" width="780" height="120" rx="9" fill="white" stroke="#b37c23" stroke-width="2"/><text x="888.5" y="1759" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">PostgreSQL</text><text x="621.015625" y="1789" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Operaciones, pesos, saldos financieros, costos, auditoría y contenido PDF.</text><rect x="1480" y="1030" width="280" height="286" rx="16" fill="#ece7f6" stroke="#75539b" stroke-width="2"/><rect x="1482" y="1032" width="276" height="53" rx="10" fill="#75539b" stroke="none" stroke-width="2"/><text x="1505.0078125" y="1066" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white">SISTEMA EXTERNO</text><rect x="1500" y="1110" width="240" height="180" rx="9" fill="white" stroke="#75539b" stroke-width="2"/><text x="1581.0" y="1146" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">App de</text><text x="1543.0" y="1172" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">comunicación</text><text x="1513.5" y="1202" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Destino del PDF elegido</text><text x="1545.5" y="1226" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">por el usuario en</text><text x="1583.0" y="1250" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Android.</text><polyline points="635,765 635,840 1450,840 1450,1200 1480,1200" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1480,1200 1464.4774880146908,1206.9319277020127 1464.4774880146908,1193.0680722979873" fill="#6b7d93"/><rect x="1160.5078125" y="847" width="278.984375" height="28" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="1166.5078125" y="869" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Comparte PDF desde Android</text><text x="75" y="1962" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">Color por responsabilidad; la etiqueta identifica cada capa.</text><text x="75" y="2002" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">La captura local conserva pendientes. La API confirma operaciones y dinero. No hay cálculo de existencias.</text><rect x="54" y="2036" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="2074" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Vista conceptual: Android y la API son aplicaciones separadas; los módulos backend se despliegan juntos. Los PDF se guardan en PostgreSQL y se comparten desde el</text><text x="76" y="2102" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">dispositivo. Canal externo de avisos por definir; no se incorporan pasarela, ERP, courier ni inventario.</text><text x="62" y="2166" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  14 historias  ·  Sin saldo de mercadería</text></svg>