<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2110" viewBox="0 0 1800 2110" role="img"><title>C4 Nivel 3 · Componentes de la API Mercado</title><desc>Ocho módulos de negocio y responsabilidades transversales en un único backend</desc><rect width="1800" height="2110" fill="#f7f9fc"/><rect x="0" y="0" width="1800" height="150" fill="#14283f"/><text x="64" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">C4 Nivel 3 · Componentes de la API Mercado</text><text x="64" y="114" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#c8d8e9">Ocho módulos de negocio y responsabilidades transversales en un único backend</text><rect x="480" y="195" width="840" height="115" rx="16" fill="#e1effb" stroke="#2865b0" stroke-width="2"/><text x="498" y="235" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2865b0">Aplicación Android</text><text x="498" y="273" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Captura, consultas, cola offline y envío por WhatsApp o correo.</text><polyline points="900,310 900,400 495,400 495,535" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="495,535 502.0,519.0 488.0,519.0" fill="#6b7d93"/><rect x="903" y="373" width="214" height="26" rx="3" fill="#f7f9fc"/><text x="1010" y="392" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c" text-anchor="middle">HTTPS / JSON · /api/v1</text><rect x="80" y="455" width="1640" height="1235" fill="none" stroke="#53647c" stroke-width="2" stroke-dasharray="8 6"/><text x="900" y="492" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c" text-anchor="middle">API NestJS · Despliegue conjunto de los módulos</text><rect x="145" y="535" width="700" height="130" rx="16" fill="#e1effb" stroke="#2865b0" stroke-width="2"/><text x="163" y="575" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2865b0">API REST</text><text x="163" y="613" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Controladores, DTO y guardas: validar y delegar.</text><rect x="955" y="535" width="700" height="130" rx="16" fill="#e6edf9" stroke="#365c9d" stroke-width="2"/><text x="973" y="575" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#365c9d">1 · Identidad y acceso</text><text x="973" y="613" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU07 / HU12 · Sesión, Encargados y reemplazos.</text><polyline points="845,600 955,600" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="955,600 939.0,593.0 939.0,607.0" fill="#6b7d93"/><rect x="856" y="569" width="88" height="26" rx="3" fill="#f7f9fc"/><text x="900" y="588" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c" text-anchor="middle">autoriza</text><rect x="140" y="800" width="440" height="170" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="158" y="840" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">2 · Recepción y compras</text><text x="158" y="878" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU01–02 · Sacos, cierre y</text><text x="158" y="904" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">liquidación al proveedor.</text><rect x="680" y="800" width="440" height="170" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="698" y="840" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">3 · Ventas y despachos</text><text x="698" y="878" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU03 · Venta, anulación y</text><text x="698" y="904" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">devoluciones comerciales.</text><rect x="1220" y="800" width="440" height="170" rx="16" fill="#e9edf3" stroke="#53647c" stroke-width="2"/><text x="1238" y="840" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#53647c">Referencias comerciales</text><text x="1238" y="878" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Proveedores, compradores, variedades,</text><text x="1238" y="904" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">calidad, procedencia y vehículos.</text><rect x="140" y="1080" width="440" height="170" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="158" y="1120" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">4 · Cuentas y caja</text><text x="158" y="1158" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU04/08/14 · Cuotas, abonos,</text><text x="158" y="1184" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">caja y vencimientos.</text><rect x="680" y="1080" width="440" height="170" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="698" y="1120" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">5 · Costos logísticos</text><text x="698" y="1158" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU09 · Flete y estiba:</text><text x="698" y="1184" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">registro y liquidación.</text><rect x="1220" y="1080" width="440" height="170" rx="16" fill="#e9edf3" stroke="#53647c" stroke-width="2"/><text x="1238" y="1120" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#53647c">Auditoría</text><text x="1238" y="1158" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU13 · Quién, cuándo, qué y</text><text x="1238" y="1184" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">por qué de cada cambio.</text><rect x="140" y="1370" width="440" height="170" rx="16" fill="#efe7f8" stroke="#7950a8" stroke-width="2"/><text x="158" y="1410" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7950a8">6 · Documentos</text><text x="158" y="1448" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU10/16 · Comprobantes PDF y</text><text x="158" y="1474" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">estado de cuenta del comprador.</text><rect x="680" y="1370" width="440" height="170" rx="16" fill="#efe7f8" stroke="#7950a8" stroke-width="2"/><text x="698" y="1410" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7950a8">7 · Mensajería</text><text x="698" y="1448" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU14–16 · Destinatarios, avisos e</text><text x="698" y="1474" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">intentos de envío manual.</text><rect x="1220" y="1370" width="440" height="170" rx="16" fill="#efe7f8" stroke="#7950a8" stroke-width="2"/><text x="1238" y="1410" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7950a8">8 · Reportes y analítica</text><text x="1238" y="1448" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU06/11 · Reportes, historial,</text><text x="1238" y="1474" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">tendencias y predicción.</text><polyline points="495,665 495,720 360,720 360,800" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="360,800 367.0,784.0 353.0,784.0" fill="#6b7d93"/><polyline points="495,720 900,720 900,800" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,800 907.0,784.0 893.0,784.0" fill="#6b7d93"/><polyline points="900,720 1440,720 1440,800" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1440,800 1447.0,784.0 1433.0,784.0" fill="#6b7d93"/><polyline points="300,970 300,1080" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="300,1080 307.0,1064.0 293.0,1064.0" fill="#6b7d93"/><rect x="215.5" y="1011" width="169" height="26" rx="3" fill="#f7f9fc"/><text x="300" y="1030" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c" text-anchor="middle">obligación / pago</text><polyline points="780,970 780,1010 520,1010 520,1080" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="520,1080 527.0,1064.0 513.0,1064.0" fill="#6b7d93"/><rect x="583.5" y="983" width="133" height="26" rx="3" fill="#f7f9fc"/><text x="650" y="1002" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c" text-anchor="middle">cobro / deuda</text><polyline points="1000,970 1000,1080" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1000,1080 1007.0,1064.0 993.0,1064.0" fill="#6b7d93"/><rect x="1009.5" y="1021" width="61" height="26" rx="3" fill="#f7f9fc"/><text x="1040" y="1040" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c" text-anchor="middle">flete</text><polyline points="680,1200 580,1200" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="580,1200 596.0,1207.0 596.0,1193.0" fill="#6b7d93"/><rect x="604" y="1169" width="52" height="26" rx="3" fill="#f7f9fc"/><text x="630" y="1188" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c" text-anchor="middle">caja</text><polyline points="580,1490 680,1490" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="680,1490 664.0,1483.0 664.0,1497.0" fill="#6b7d93"/><rect x="590.5" y="1459" width="79" height="26" rx="3" fill="#f7f9fc"/><text x="630" y="1478" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c" text-anchor="middle">archivo</text><text x="120" y="1625" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53647c">Todos los módulos registran sus cambios en Auditoría. Documentos y Reportes leen hechos confirmados.</text><text x="120" y="1655" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53647c">Compras y ventas confirman su cuenta o caja y su flete en la misma transacción.</text><polyline points="900,1690 900,1760" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,1760 907.0,1744.0 893.0,1744.0" fill="#6b7d93"/><rect x="450" y="1760" width="900" height="115" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="468" y="1800" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">PostgreSQL central</text><text x="468" y="1838" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Operaciones, finanzas, auditoría, PDF e intentos de envío.</text><rect x="54" y="1920" width="1692" height="94" rx="12" fill="#eaf0f6"/><text x="76" y="1958" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Las flechas internas son colaboraciones dentro de un proceso, no microservicios. La cola offline y el envío por</text><text x="76" y="1986" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">WhatsApp o correo ocurren en Android; Mensajería registra el intento. Sin saldo de mercadería.</text><text x="62" y="2070" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  16 historias  ·  8 módulos  ·  Sin saldo de mercadería</text></svg>