<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2110" viewBox="0 0 1800 2110" role="img"><title>C4 Nivel 3 · Componentes de la API Mercado</title><desc>Colaboración lógica dentro de un único backend · Componentes distintos de la vista general</desc><rect width="1800" height="2110" fill="#f7f9fc"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#14283f" stroke="none" stroke-width="2"/><text x="64" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="white">C4 Nivel 3 · Componentes de la API Mercado</text><text x="64" y="114" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#c8d8e9">Colaboración lógica dentro de un único backend · Componentes distintos de la vista general</text><rect x="480" y="205" width="840" height="125" rx="16" fill="#e1effb" stroke="#2865b0" stroke-width="2"/><text x="498" y="245" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2865b0">Aplicación Android</text><text x="498" y="283" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Captura y consultas. Cola y sincronización en el dispositivo.</text><polyline points="900,330 900,430 495,430 495,555" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="495,555 488.0680722979873,539.4774880146907 501.9319277020127,539.4774880146907" fill="#6b7d93"/><rect x="1016.5" y="405" width="207.0" height="26" rx="3" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="1024.5" y="425" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">HTTPS / JSON · /api/v1</text><rect x="80" y="475" width="1640" height="1200" rx="0" fill="none" stroke="#53647c" stroke-width="2" stroke-dasharray="8 6"/><text x="700" y="512" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">API NestJS · Despliegue conjunto de los módulos</text><rect x="145" y="555" width="700" height="150" rx="16" fill="#e1effb" stroke="#2865b0" stroke-width="2"/><text x="163" y="595" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2865b0">API REST</text><text x="163" y="633" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Controladores y DTO: validar entrada y delegar.</text><rect x="955" y="555" width="700" height="150" rx="16" fill="#e6edf9" stroke="#365c9d" stroke-width="2"/><text x="973" y="595" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#365c9d">Identidad y reemplazos</text><text x="973" y="633" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU07 / HU12 · RF01–02. Protege todos los contratos.</text><polyline points="845,630 955,630" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="955,630 939.4774880146907,636.9319277020127 939.4774880146907,623.0680722979873" fill="#6b7d93"/><rect x="860.0" y="592" width="80.0" height="26" rx="3" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="868.0" y="612" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">autoriza</text><rect x="140" y="855" width="440" height="180" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="158" y="895" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Recepción y pesaje</text><text x="158" y="933" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU01 · RF03–06B: proveedor, variedad,</text><text x="158" y="959" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">vehículo y pesos.</text><rect x="680" y="855" width="440" height="180" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="698" y="895" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Compras</text><text x="698" y="933" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU02 · RF03/07/14: condiciones y líquido</text><text x="698" y="959" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">del proveedor.</text><rect x="1220" y="855" width="440" height="180" rx="16" fill="#e8f4ec" stroke="#28784e" stroke-width="2"/><text x="1238" y="895" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#28784e">Ventas y despachos</text><text x="1238" y="933" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU03 · RF03–04/10–11/13: comprador,</text><text x="1238" y="959" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">despacho y deuda.</text><rect x="140" y="1130" width="440" height="180" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="158" y="1170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">Cuentas y caja</text><text x="158" y="1208" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU04/08/14 · RF13–16/23: abonos,</text><text x="158" y="1234" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">saldos y avisos.</text><rect x="680" y="1130" width="440" height="180" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="698" y="1170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">Flete y estiba</text><text x="698" y="1208" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU09 · RF15: costos y liquidación por</text><text x="698" y="1234" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">grupo.</text><rect x="1220" y="1130" width="440" height="180" rx="16" fill="#e9edf3" stroke="#53647c" stroke-width="2"/><text x="1238" y="1170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#53647c">Auditoría</text><text x="1238" y="1208" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU13 · RF22: acciones y responsables.</text><rect x="140" y="1430" width="440" height="180" rx="16" fill="#efe7f8" stroke="#7950a8" stroke-width="2"/><text x="158" y="1470" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7950a8">Historial comercial</text><text x="158" y="1508" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU11 · RF24: búsqueda y detalle de</text><text x="158" y="1534" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">operaciones.</text><rect x="680" y="1430" width="440" height="180" rx="16" fill="#efe7f8" stroke="#7950a8" stroke-width="2"/><text x="698" y="1470" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7950a8">Reportes y comprobantes</text><text x="698" y="1508" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU10 · RF12: comprobantes. RF17–18:</text><text x="698" y="1534" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">consultas.</text><rect x="1220" y="1430" width="440" height="180" rx="16" fill="#efe7f8" stroke="#7950a8" stroke-width="2"/><text x="1238" y="1470" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7950a8">Analítica</text><text x="1238" y="1508" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">HU06 · RF18–20: tendencias y</text><text x="1238" y="1534" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">evaluación CL-08.</text><polyline points="495,705 495,770" fill="none" stroke="#6b7d93" stroke-width="3"/><polyline points="360,770 1440,770" fill="none" stroke="#6b7d93" stroke-width="3"/><polyline points="360,770 360,855" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="360,855 353.0680722979873,839.4774880146907 366.9319277020127,839.4774880146907" fill="#6b7d93"/><polyline points="900,770 900,855" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,855 893.0680722979873,839.4774880146907 906.9319277020127,839.4774880146907" fill="#6b7d93"/><polyline points="1440,770 1440,855" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1440,855 1433.0680722979873,839.4774880146907 1446.9319277020127,839.4774880146907" fill="#6b7d93"/><polyline points="580,945 680,945" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="680,945 664.4774880146907,951.9319277020127 664.4774880146907,938.0680722979873" fill="#6b7d93"/><rect x="595.5" y="807" width="69.0" height="26" rx="3" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="603.5" y="827" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">pesaje</text><polyline points="900,1035 900,1080 360,1080 360,1130" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="360,1130 353.0680722979873,1114.4774880146908 366.9319277020127,1114.4774880146908" fill="#6b7d93"/><rect x="544.0" y="1048" width="152.0" height="26" rx="3" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="552.0" y="1068" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">obligación / pago</text><polyline points="1440,1035 1440,1095 570,1095 570,1130" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="570,1130 563.0680722979873,1114.4774880146908 576.9319277020127,1114.4774880146908" fill="#6b7d93"/><rect x="1107.0" y="1064" width="126.0" height="26" rx="3" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="1115.0" y="1084" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">cobro / deuda</text><polyline points="680,1260 580,1260" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="580,1260 595.5225119853093,1253.0680722979873 595.5225119853093,1266.9319277020127" fill="#6b7d93"/><rect x="596.0" y="1328" width="68.0" height="26" rx="3" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="604.0" y="1348" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">costos</text><text x="120" y="1662" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#53647c">Auditoría registra mutaciones. Historial, reportes y analítica consultan hechos confirmados.</text><polyline points="900,1675 900,1770" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="900,1770 893.0680722979873,1754.4774880146908 906.9319277020127,1754.4774880146908" fill="#6b7d93"/><rect x="450" y="1770" width="900" height="130" rx="16" fill="#fff0d4" stroke="#ae721b" stroke-width="2"/><text x="468" y="1810" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ae721b">PostgreSQL central</text><text x="468" y="1848" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20344c">Datos comerciales, finanzas, auditoría y contenido PDF.</text><rect x="54" y="1956" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="1994" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Las flechas internas son colaboraciones lógicas, no microservicios. Existen entidades compartidas en transacciones. Pendientes offline y compartición PDF pertenecen a</text><text x="76" y="2022" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Android. El canal externo de avisos RF23 sigue por definir. Sin saldo de mercadería.</text><text x="62" y="2086" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  14 historias  ·  Sin saldo de mercadería</text></svg>