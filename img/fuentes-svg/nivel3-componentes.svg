e] · HU09 · RF15</text><text x="1099.5" y="1189" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Costos y liquidación por</text><text x="1177.5" y="1212" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">grupo</text><rect x="135" y="1295" width="275" height="150" rx="10" fill="#efe7f8" stroke="#75539b" stroke-width="2"/><text x="175.0" y="1331" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">Historial comercial</text><text x="195.0078125" y="1357" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20344c">[Componente] · HU11</text><text x="173.0" y="1389" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Búsqueda y detalle por</text><text x="238.0" y="1412" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">negocio</text><rect x="445" y="1295" width="275" height="150" rx="10" fill="#efe7f8" stroke="#75539b" stroke-width="2"/><text x="501.5" y="1331" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">Reportes y PDF</text><text x="478.5" y="1357" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20344c">[Componente] · HU10 · RF17</text><text x="467.0" y="1389" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Consultas y comprobantes</text><text x="548.0" y="1412" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">internos</text><rect x="755" y="1295" width="275" height="150" rx="10" fill="#e9edf3" stroke="#53647c" stroke-width="2"/><text x="845.0" y="1331" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">Auditoría</text><text x="815.0" y="1357" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20344c">[Componente] · HU13</text><text x="772.5" y="1389" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Responsable, acción, fecha</text><text x="856.5" y="1412" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">y motivo</text><rect x="1065" y="1295" width="275" height="150" rx="10" fill="#efe7f8" stroke="#75539b" stroke-width="2"/><text x="1157.5" y="1331" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">Analítica</text><text x="1125.0" y="1357" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20344c">[Componente] · HU06</text><text x="1095.015625" y="1389" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Tendencias y estimación</text><text x="1144.5" y="1412" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">condicionada</text><polyline points="272,797 1202,797" fill="none" stroke="#6b7d93" stroke-width="3"/><polyline points="272.5,797 272.5,895" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="272.5,895 265.5680722979873,879.4774880146907 279.4319277020127,879.4774880146907" fill="#6b7d93"/><polyline points="582.5,797 582.5,895" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="582.5,895 575.5680722979873,879.4774880146907 589.4319277020127,879.4774880146907" fill="#6b7d93"/><polyline points="892.5,797 892.5,895" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="892.5,895 885.5680722979873,879.4774880146907 899.4319277020127,879.4774880146907" fill="#6b7d93"/><polyline points="1202.5,797 1202.5,895" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1202.5,895 1195.5680722979873,879.4774880146907 1209.4319277020127,879.4774880146907" fill="#6b7d93"/><polyline points="1030,970 1065,970" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1065,970 1049.4774880146908,976.9319277020127 1049.4774880146908,963.0680722979873" fill="#6b7d93"/><rect x="998.0" y="865" width="164.0" height="27" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="1003.0" y="886" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Pesaje → compra</text><polyline points="1202,1045 1202,1070 892,1070 892,1095" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="892,1095 885.0680722979873,1079.4774880146908 898.9319277020127,1079.4774880146908" fill="#6b7d93"/><rect x="769.5" y="1042" width="255.0" height="27" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="774.5" y="1063" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Compra → obligación / pago</text><polyline points="720,1170 755,1170" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="755,1170 739.4774880146907,1176.9319277020127 739.4774880146907,1163.0680722979873" fill="#6b7d93"/><rect x="620.5078125" y="1259" width="208.984375" height="27" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="625.5078125" y="1280" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Venta → cobro / deuda</text><polyline points="1065,1215 1048,1215 1048,1277 892,1277 892,1245" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="892,1245 898.9319277020127,1260.5225119853092 885.0680722979873,1260.5225119853092" fill="#6b7d93"/><rect x="1012.0" y="1255" width="136.0" height="27" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="1017.0" y="1276" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Costos → caja</text><text x="123" y="1521" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#52677f">Identidad protege todos los contratos · Auditoría transversal · Persistencia central compartida</text><polyline points="785,1555 785,1643" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="785,1643 778.0680722979873,1627.4774880146908 791.9319277020127,1627.4774880146908" fill="#6b7d93"/><rect x="922.5078125" y="1583" width="294.984375" height="27" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="927.5078125" y="1604" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Transacciones y consultas [SQL]</text><rect x="480" y="1643" width="610" height="167" rx="10" fill="#fff0d4" stroke="#b37c23" stroke-width="2"/><text x="683.5" y="1679" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">PostgreSQL central</text><text x="655.0" y="1705" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20344c">[Contenedor: almacén transaccional]</text><text x="495.515625" y="1737" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Operaciones, pesos, saldos financieros, auditoría y contenido PDF.</text><rect x="1465" y="220" width="295" height="214" rx="10" fill="#e9edf3" stroke="#53647c" stroke-width="2"/><text x="1500.5" y="256" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">App de comunicación</text><text x="1551.0" y="282" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20344c">[Sistema externo]</text><text x="1491.5" y="314" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Destino del PDF compartido</text><text x="1523.0078125" y="337" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">desde Android por el</text><text x="1568.0" y="360" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Mayorista.</text><polyline points="1080,308 1465,308" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1465,308 1449.4774880146908,314.9319277020127 1449.4774880146908,301.0680722979873" fill="#6b7d93"/><rect x="1195.5" y="273" width="139.0" height="27" rx="4" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="1200.5" y="294" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">Comparte PDF</text><text x="1474" y="660" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#20344c">Avisos externos HU14:</text><text x="1474" y="693" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">canal por definir.</text><text x="1474" y="734" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">No se añade proveedor</text><text x="1474" y="761" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">de mensajería contratado.</text><rect x="70" y="1840" width="17" height="17" rx="3" fill="#365c9d" stroke="none" stroke-width="2"/><text x="97" y="1853" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Acceso</text><rect x="350" y="1840" width="17" height="17" rx="3" fill="#367eb0" stroke="none" stroke-width="2"/><text x="377" y="1853" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Catálogos</text><rect x="630" y="1840" width="17" height="17" rx="3" fill="#32865a" stroke="none" stroke-width="2"/><text x="657" y="1853" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Operaciones</text><rect x="910" y="1840" width="17" height="17" rx="3" fill="#b37c23" stroke="none" stroke-width="2"/><text x="937" y="1853" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Finanzas</text><rect x="1190" y="1840" width="17" height="17" rx="3" fill="#75539b" stroke="none" stroke-width="2"/><text x="1217" y="1853" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Consultas</text><rect x="1470" y="1840" width="17" height="17" rx="3" fill="#53647c" stroke="none" stroke-width="2"/><text x="1497" y="1853" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Auditoría</text><rect x="54" y="1986" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="2024" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">Todos los módulos se despliegan juntos. Las flechas representan colaboración lógica; existen transacciones con entidades compartidas. PDF persiste en PostgreSQL, no</text><text x="76" y="2052" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">en un almacén externo separado. Sin inventario, Redis, ERP, pasarela de pagos ni courier añadidos desde el ejemplo.</text><text x="62" y="2116" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  14 historias  ·  Sin saldo de mercadería</text></svg>