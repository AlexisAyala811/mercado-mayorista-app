="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">Rutas, pantallas y controladores</text><rect x="570.0" y="200.0" width="360" height="140" rx="18" fill="white" stroke="#2f7154" stroke-width="3"/><text x="750" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#24364b">Aplicación</text><text x="750" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">Coordina operaciones</text><rect x="1050.0" y="200.0" width="360" height="140" rx="18" fill="white" stroke="#2f7154" stroke-width="3"/><text x="1230" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#24364b">Dominio</text><text x="1230" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">Dinero, peso y reparto</text><rect x="570.0" y="590.0" width="360" height="140" rx="18" fill="white" stroke="#2f7154" stroke-width="3"/><text x="750" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#24364b">Infraestructura</text><text x="750" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">REST, ORM y almacenamiento</text><text x="65" y="920" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">La separación de reglas es el objetivo. Algunos servicios dependen directamente de DataSource; Clean</text><text x="65" y="947" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#24364b">Architecture completa no está acreditada.</text><text x="65" y="983" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#5a6a7b">MERCADO · Gestión mayorista de papa · Primer entregable</text></svg>