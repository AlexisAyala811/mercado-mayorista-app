rar pesaje</text><text x="505.0" y="541" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">HU01: captura y</text><text x="547.5" y="563" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">cierre</text><rect x="675" y="480" width="190" height="150" rx="8" fill="white" stroke="#68a05f" stroke-width="2"/><text x="686.5" y="513" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Liquidar compra</text><text x="687.5" y="541" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">HU02: condiciones y</text><text x="733.0" y="563" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">resultado</text><rect x="875" y="480" width="190" height="150" rx="8" fill="white" stroke="#68a05f" stroke-width="2"/><text x="892.5" y="513" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Registrar venta</text><text x="896.0" y="541" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">HU03: despacho y</text><text x="947.5" y="563" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">cobro</text><rect x="475" y="692" width="590" height="585" rx="14" fill="#fff1d3" stroke="#c28c25" stroke-width="2"/><text x="557.0" y="737" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">DOMINIO · modelos, reglas y contratos</text><text x="505.0" y="779" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20344c">Modelos y reglas actuales</text><text x="828.5" y="779" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20344c">Puertos propuestos</text><rect x="492" y="810" width="264" height="125" rx="8" fill="white" stroke="#c28c25" stroke-width="2"/><text x="524.5" y="843" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Recepción y pesaje</text><text x="511.0" y="871" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Saco, variedad, bruto, tara y</text><text x="606.5" y="893" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">neto</text><rect x="778" y="810" width="264" height="125" rx="8" fill="white" stroke="#c28c25" stroke-width="2"/><text x="845.5" y="843" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Operaciones</text><text x="848.0" y="868" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">comerciales</text><text x="813.0" y="896" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Enviar orden / recuperar</text><text x="873.0" y="918" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">resultado</text><rect x="492" y="950" width="264" height="125" rx="8" fill="white" stroke="#c28c25" stroke-width="2"/><text x="511.0" y="983" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Liquidación comercial</text><text x="536.0" y="1011" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Importes, flete y saldo</text><text x="585.0" y="1033" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">financiero</text><rect x="778" y="950" width="264" height="125" rx="8" fill="white" stroke="#c28c25" stroke-width="2"/><text x="813.5" y="983" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Pendientes locales</text><text x="819.5" y="1011" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Guardar / leer órdenes</text><text x="878.5" y="1033" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">cifradas</text><rect x="492" y="1090" width="264" height="125" rx="8" fill="white" stroke="#c28c25" stroke-width="2"/><text x="549.0078125" y="1123" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Venta y sesión</text><text x="539.0" y="1151" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Datos de despacho e</text><text x="587.5" y="1173" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">identidad</text><rect x="778" y="1090" width="264" height="125" rx="8" fill="white" stroke="#c28c25" stroke-width="2"/><text x="789.5" y="1123" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Sesión y comprobantes</text><text x="794.5" y="1151" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Leer identidad / obtener PDF</text><text x="525.5078125" y="1253" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">TypeScript: reglas sin React Native, Expo ni transporte HTTP</text><rect x="155" y="550" width="275" height="750" rx="0" fill="#dceefa" stroke="#5692c2" stroke-width="2"/><text x="200.515625" y="592" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">PRESENTACIÓN</text><text x="207.0" y="625" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">src/app · features · ui</text><rect x="172" y="662" width="240" height="126" rx="8" fill="white" stroke="#5692c2" stroke-width="2"/><text x="213.5" y="695" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Acceso y menú</text><text x="194.0" y="723" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Sesión, rol y navegación</text><rect x="172" y="812" width="240" height="126" rx="8" fill="white" stroke="#5692c2" stroke-width="2"/><text x="187.5" y="845" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Recepción y compra</text><text x="207.0" y="873" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Captura y revisión de</text><text x="244.5" y="895" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">condiciones</text><rect x="172" y="962" width="240" height="126" rx="8" fill="white" stroke="#5692c2" stroke-width="2"/><text x="204.5078125" y="995" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Ventas y cuentas</text><text x="213.0" y="1023" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Registro, consulta y</text><text x="226.5" y="1045" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">validación visual</text><rect x="172" y="1112" width="240" height="126" rx="8" fill="white" stroke="#5692c2" stroke-width="2"/><text x="216.5" y="1145" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Historial y PDF</text><text x="213.0" y="1173" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Búsqueda, detalle y</text><text x="241.0" y="1195" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">compartición</text><rect x="1110" y="550" width="285" height="750" rx="0" fill="#eee6fb" stroke="#8664af" stroke-width="2"/><text x="1136.5" y="592" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20344c">INFRAESTRUCTURA</text><text x="1200.5" y="626" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20344c">src/services</text><rect x="1127" y="662" width="250" height="126" rx="8" fill="white" stroke="#8664af" stroke-width="2"/><text x="1184.0078125" y="695" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Servicios API</text><text x="1156.5" y="723" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">api-client, reception-api,</text><text x="1216.0" y="745" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">sales-api</text><rect x="1127" y="812" width="250" height="126" rx="8" fill="white" stroke="#8664af" stroke-width="2"/><text x="1191.0" y="845" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Cola cifrada</text><text x="1151.5" y="873" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">encrypted-queue-storage</text><rect x="1127" y="962" width="250" height="126" rx="8" fill="white" stroke="#8664af" stroke-width="2"/><text x="1179.0" y="995" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Sesión segura</text><text x="1183.5" y="1023" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">session-storage /</text><text x="1202.0" y="1045" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">SecureStore</text><rect x="1127" y="1112" width="250" height="126" rx="8" fill="white" stroke="#8664af" stroke-width="2"/><text x="1177.0" y="1145" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">Comprobantes</text><text x="1167.0" y="1173" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">receipt-sharing / PDF</text><text x="1205.5" y="1195" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">autenticado</text><polyline points="50,760 155,760" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="155,760 139.47748801469075,766.9319277020127 139.47748801469075,753.0680722979873" fill="#6b7d93"/><text x="15" y="683" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20344c">Usuario</text><text x="15" y="711" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#20344c">táctil</text><polyline points="430,730 445,730 445,555 475,555" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="475,555 459.4774880146908,561.9319277020127 459.4774880146908,548.0680722979873" fill="#6b7d93"/><rect x="409.0" y="520" width="62.0" height="25" rx="3" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="414.0" y="540" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">invoca</text><polyline points="570,630 570,692" fill="none" stroke="#438642" stroke-width="3" stroke-dasharray="10 8"/><polygon points="570,692 563.0680722979873,676.4774880146907 576.9319277020127,676.4774880146907" fill="#438642"/><polyline points="770,630 770,692" fill="none" stroke="#438642" stroke-width="3" stroke-dasharray="10 8"/><polygon points="770,692 763.0680722979873,676.4774880146907 776.9319277020127,676.4774880146907" fill="#438642"/><polyline points="970,630 970,692" fill="none" stroke="#438642" stroke-width="3" stroke-dasharray="10 8"/><polygon points="970,692 963.0680722979873,676.4774880146907 976.9319277020127,676.4774880146907" fill="#438642"/><rect x="667.5" y="650" width="205.0" height="25" rx="3" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="672.5" y="670" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#438642">usa modelos y contratos</text><polyline points="1110,725 1098,725 1098,870 1042,870" fill="none" stroke="#8664af" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1042,870 1057.5225119853092,863.0680722979873 1057.5225119853092,876.9319277020127" fill="#8664af"/><polyline points="1110,875 1098,875 1098,1010 1042,1010" fill="none" stroke="#8664af" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1042,1010 1057.5225119853092,1003.0680722979873 1057.5225119853092,1016.9319277020127" fill="#8664af"/><polyline points="1110,1025 1098,1025 1098,1150 1042,1150" fill="none" stroke="#8664af" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1042,1150 1057.5225119853092,1143.0680722979873 1057.5225119853092,1156.9319277020127" fill="#8664af"/><polyline points="1110,1175 1098,1175 1098,1190 1042,1190" fill="none" stroke="#8664af" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1042,1190 1057.5225119853092,1183.0680722979873 1057.5225119853092,1196.9319277020127" fill="#8664af"/><text x="1120" y="1347" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#71509a">Puertos: objetivo de diseño</text><rect x="1480" y="785" width="280" height="350" rx="8" fill="#edf0f5" stroke="#54657b" stroke-width="2"/><text x="1524.5" y="818" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20344c">API Mercado REST</text><text x="1511.5078125" y="846" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">NestJS · monolito modular.</text><text x="1498.0" y="868" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Autoriza por negocio, confirma</text><text x="1533.0" y="890" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">operaciones y saldos.</text><text x="1496.0" y="912" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">PostgreSQL permanece detrás</text><text x="1581.0078125" y="934" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">de la API.</text><polyline points="1395,725 1455,725 1455,930 1480,930" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="1480,930 1464.4774880146908,936.9319277020127 1464.4774880146908,923.0680722979873" fill="#6b7d93"/><rect x="1514.0" y="747" width="132.0" height="25" rx="3" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="1519.0" y="767" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">HTTPS / JSON</text><text x="1485" y="1188" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">La previsualización local</text><text x="1485" y="1213" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">no sustituye el cálculo</text><text x="1485" y="1238" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">confirmado en servidor.</text><rect x="155" y="1410" width="1240" height="78" rx="0" fill="white" stroke="#54657b" stroke-width="2"/><text x="404.0" y="1444" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">RAÍZ DE COMPOSICIÓN · src/app/_layout.tsx y proveedores de features</text><text x="362.0078125" y="1473" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20344c">Conecta sesión, navegación y servicios. Puertos intercambiables: evolución por implementar y verificar.</text><polyline points="1252,1410 1252,1300" fill="none" stroke="#8664af" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1252,1300 1258.9319277020127,1315.5225119853092 1245.0680722979873,1315.5225119853092" fill="#8664af"/><text x="135" y="1562" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20344c">Leyenda y reglas de dependencia</text><polyline points="145,1600 235,1600" fill="none" stroke="#6b7d93" stroke-width="3"/><polygon points="235,1600 219.47748801469075,1606.9319277020127 219.47748801469075,1593.0680722979873" fill="#6b7d93"/><text x="253" y="1605" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Llamada durante la ejecución</text><polyline points="145,1642 235,1642" fill="none" stroke="#438642" stroke-width="3" stroke-dasharray="10 8"/><polygon points="235,1642 219.47748801469075,1648.9319277020127 219.47748801469075,1635.0680722979873" fill="#438642"/><text x="253" y="1647" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Uso de modelos/contratos hacia el dominio</text><polyline points="870,1600 960,1600" fill="none" stroke="#8664af" stroke-width="3" stroke-dasharray="10 8"/><polygon points="960,1600 944.4774880146907,1606.9319277020127 944.4774880146907,1593.0680722979873" fill="#8664af"/><text x="980" y="1605" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">Realización de puertos propuesta</text><text x="870" y="1650" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#20344c">El dominio no importa UI, HTTP ni almacenamiento.</text><rect x="54" y="1696" width="1692" height="94" rx="12" fill="#eaf0f6" stroke="none" stroke-width="2"/><text x="76" y="1734" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">La imagen adapta el enfoque del ejemplo a Mercado. Puertos y casos de uso son responsabilidades de diseño, no clases nuevas ya implementadas. La sesión, cola y</text><text x="76" y="1762" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#20344c">API tienen adaptadores concretos; la inversión de dependencias completa requiere convergencia. Sin inventario ni saldo de mercadería.</text><text x="62" y="1826" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677f">MERCADO  ·  Gestión mayorista de papa  ·  14 historias  ·  Sin saldo de mercadería</text></svg>